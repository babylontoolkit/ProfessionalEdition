    <script type="text/javascript" nonce="###HASH###">
    window["BJS"] = "engine.html";
    ///////////////////////////////////////////////////////////
    // Babylon Smooth Tween Mode (Optional)
    ///////////////////////////////////////////////////////////
    // createjs.Ticker.timingMode = createjs.Ticker.RAF;
    ///////////////////////////////////////////////////////////
    // Babylon Query String Hooks
    ///////////////////////////////////////////////////////////
    window.getUrlParameter = (name) => {
        if (window.location == null || window.location.search == null || window.location.search === "") return null;
        name = name.replace(/[\[]/, '\\[').replace(/[\]]/, '\\]');
        var regex = new RegExp('[\\?&]' + name + '=([^&#]*)');
        var results = regex.exec(window.location.search);
        return (results !== null) ? decodeURIComponent(results[1].replace(/\+/g, ' ')) : null;
    };
    ///////////////////////////////////////////////////////////
    // Window Mobile Devcies
    ///////////////////////////////////////////////////////////
    window.isMobileDevice = () => {
        let result = false;
        if (navigator != null && navigator.userAgent != null) {
        const n = navigator.userAgent;
        if (n.match(/Android/i) || n.match(/webOS/i) || n.match(/iPhone|iPad|iPod/i) || n.match(/BlackBerry/i) || n.match(/Opera Mini/i) || n.match(/Windows Phone/i)) {
            result = true;
        }
        }
        return result;
    };
    ///////////////////////////////////////////////////////////
    // Babylon Content Installer (Progressive Web App)
    ///////////////////////////////////////////////////////////
    // A Progressive Web App export sets window.useServiceWorker and window.contentInstallerOptions here: the page then starts
    // TOOLKIT.ContentInstaller (which registers bt-content-worker.js) before its scene loads, so installed scene files load
    // from this device. Every other export keeps window.useServiceWorker false, sets no options and loads exactly as before.
    window.autoStartLoader = false;
    window.useServiceWorker = false;###WORK###
    /** Bytes per megabyte in the installer's splash and toast texts. */
    const CONTENT_BYTES_PER_MEGABYTE = 1048576;
    /** The update toast rounds its download size up to this fraction of a megabyte (tenths). */
    const DOWNLOAD_SIZE_STEPS_PER_MEGABYTE = 10;
    /** How long a content toast stays on screen, in milliseconds (0 keeps it until a button closes it). */
    const CONTENT_TOAST_TIMEOUT_MS = 0;
    /** How long the toast that reports a finished Prepare graphics stays on screen, in milliseconds. */
    const GRAPHICS_RESULT_TOAST_TIMEOUT_MS = 5000;
    /** The title of the content update toasts. */
    const CONTENT_UPDATE_TOAST_TITLE = "UPDATE:";
    /** The title of the Prepare graphics toasts. */
    const GRAPHICS_TOAST_TITLE = "GRAPHICS:";
    /** The Prepare graphics phase label, before its first progress report gives the counts. */
    const PREPARING_GRAPHICS_TEXT = "Preparing graphics";
    /** The content toasts this page has shown, by kind: each shows at most once per page. */
    window.shownContentToasts = { updateAvailable: false, updateReady: false, shellUpdateReady: false, contentChangedOnServer: false, graphicsOffer: false };
    /** The Prepare graphics progress toast while it shows (its message is rewritten on each progress report), else null. */
    window.graphicsProgressToast = null;
    /** True once the player pressed Cancel on the running Prepare graphics step, so its end shows no result toast. */
    window.graphicsCancelled = false;
    /**
     * Formats a byte count as megabytes with one decimal, e.g. 12950000 -> "12.4".
     * @param {number} byteCount - Bytes.
     * @returns {string} The megabytes text.
     */
    window.formatContentMegabytes = (byteCount) => (byteCount / CONTENT_BYTES_PER_MEGABYTE).toFixed(1);
    /**
     * Formats a download size for the update toast: megabytes rounded up to one decimal, so a small update never reads
     * "0.0 MB", e.g. 2733 -> "0.1".
     * @param {number} byteCount - Bytes to download.
     * @returns {string} The megabytes text.
     */
    window.formatDownloadMegabytes = (byteCount) => {
        const megabyteSteps = Math.ceil(byteCount / CONTENT_BYTES_PER_MEGABYTE * DOWNLOAD_SIZE_STEPS_PER_MEGABYTE);
        return (megabyteSteps / DOWNLOAD_SIZE_STEPS_PER_MEGABYTE).toFixed(1);
    };
    /**
     * Builds the TOOLKIT.ContentInstaller options from the exported window.contentInstallerOptions: the scene folder's
     * content manifest, plus the app shell manifest beside this page when the export installs the entire project.
     * @param {string} sceneFolderUrl - Absolute URL of the scene folder (ends with "/").
     * @returns {TOOLKIT.IContentInstallerOptions} The Initialize options.
     */
    window.createContentInstallerOptions = (sceneFolderUrl) => {
        const exportedOptions = window.contentInstallerOptions;
        const roots = [{ manifestUrl: new URL(exportedOptions.contentManifestName, sceneFolderUrl).href }];
        if (exportedOptions.appShell === true) roots.push({ manifestUrl: new URL("bt-shell-manifest.json", window.location.href).href, isAppShell: true });
        return {
            roots: roots,
            workerUrl: "bt-content-worker.js",
            installPolicy: exportedOptions.installPolicy,
            updatePolicy: exportedOptions.updatePolicy,
            enableOnLocalHost: exportedOptions.enableOnLocalHost
        };
    };
    /**
     * Formats the Prepare graphics phase line, e.g. "Preparing graphics — 3 of 18".
     * @param {TOOLKIT.IContentInstallProgress} progress - A graphics progress report (phase "graphics").
     * @returns {string} The line; the bare label while the report has no counts.
     */
    window.formatGraphicsProgress = (progress) => {
        const current = progress.graphicsCurrent;
        const total = progress.graphicsTotal;
        if (current == null || total == null || total <= 0) return PREPARING_GRAPHICS_TEXT;
        return PREPARING_GRAPHICS_TEXT + " — " + Math.min(current, total) + " of " + total;
    };
    /**
     * Shows the scene group's download progress on the splash status line and bar (the installer emits it at most every
     * 250 ms, so this is event-driven, never a frame loop). Falls back to the whole download when the group has no entry.
     * A Prepare graphics report (phase "graphics") shows its phase line instead.
     * @param {string} sceneGroupId - The scene's group id.
     * @param {TOOLKIT.IContentInstallProgress} progress - The installer's progress report.
     */
    window.showContentInstallProgress = (sceneGroupId, progress) => {
        if (progress.phase === "graphics") {
            window.setSplashStatus(PREPARING_GRAPHICS_TEXT, window.formatGraphicsProgress(progress), progress.fraction, 0);
            return;
        }
        const groupProgress = (progress.groupProgress != null) ? progress.groupProgress[sceneGroupId] : null;
        const completedBytes = (groupProgress != null) ? groupProgress.completedBytes : progress.completedBytes;
        const totalBytes = (groupProgress != null) ? groupProgress.totalBytes : progress.totalBytes;
        const fraction = (totalBytes > 0) ? Math.min(1, completedBytes / totalBytes) : progress.fraction;
        const transferText = window.formatContentMegabytes(completedBytes) + " of " + window.formatContentMegabytes(totalBytes) + " MB";
        const speedText = window.formatContentMegabytes(progress.bytesPerSecond) + " MB/s";
        window.setSplashStatus("DOWNLOADING", transferText + " · " + speedText, fraction, 0);
    };
    /**
     * Installs the scene's own group before the scene loads, with splash progress, then lets every other group install
     * during play (pwa-content-installer D33: the page never waits for more than the scene's files).
     * @param {string} sceneGroupId - The scene's group id.
     * @returns {Promise<void>} Resolves once the scene's group is installed or has failed.
     */
    window.installSceneGroupFirst = async (sceneGroupId) => {
        const installer = TOOLKIT.ContentInstaller;
        const sceneGroupStatus = installer.GetGroupStatus([sceneGroupId])[0];
        if (sceneGroupStatus != null && sceneGroupStatus.installed === true) return;
        const progressObserver = installer.OnProgressObservable.add((progress) => { window.showContentInstallProgress(sceneGroupId, progress); });
        try {
            await installer.Install([sceneGroupId]);
        } finally {
            installer.OnProgressObservable.remove(progressObserver);
        }
        void installer.Install(null);
    };
    /**
     * Starts the content installer before the scene loads (pwa-content-installer D22): registers the content worker, checks
     * for content updates, installs the scene's group first under the "everything" policy, and prepares the scene load so
     * installed files come from this device. Never blocks the game: any failure is one console warning and the scene then
     * loads from the network as before.
     * @param {string} scenepath - The scene folder URL the scene loader uses.
     * @param {string} scenename - The scene file name the scene loader uses.
     * @returns {Promise<void>} Resolves when the scene may load.
     */
    window.startContentInstaller = async (scenepath, scenename) => {
        if (window.contentInstallerOptions == null || typeof TOOLKIT === "undefined" || TOOLKIT.ContentInstaller == null) return;
        try {

                var percentage = (evt.loaded * 100 / evt.total).toFixed();
                //var percentstatus = (lstate >= 2) ? pstatus : (percentage + "%");
                var percentstatus = (percentage + "%");
                window.updateStatus(percentstatus, details, lstate);
                // DEPRECIATED: var percentstatus = (lstate >= 2) ? "" : (" " + percentage + "%");
                // DEPRECIATED: window.updateStatus(pstatus, (details + percentstatus), lstate);
            } else {
                var units = " MB";
                var dlCount = evt.loaded / megabyte;
                var progress = Math.ceil(dlCount * 100.0) / 100.0;
                if (progress > 0) {
                    if (progress >= downloaded) {
                        downloaded = progress;
                    }
                    if (downloaded > 0) {
                        if (downloaded > kilobyte) {
                            units = " GB";
                            downloaded = (downloaded / kilobyte);
                        }
                        //var sizestatus = (lstate >= 2) ? pstatus : ("" + downloaded.toFixed()) + units;
                        var sizestatus = ("" + downloaded.toFixed()) + units;
                        window.updateStatus(sizestatus, details, lstate);
                        // DEPRECIATED: var sizestatus = (lstate >= 2) ? "" : (" " + downloaded.toFixed() + units);
                        // DEPRECIATED: window.updateStatus(pstatus, (details + sizestatus), lstate);
                    }
                }
            }
        } else {
            window.updateStatus(pstatus, details, lstate);
        }
    };
    window.handleExtraProgress = (evt) => {
        var lstate = (TOOLKIT.Utilities != null) ? TOOLKIT.Utilities.GetLoadingState() : 0;
        if (evt.loaded > 0) {
            if (percent === true && evt.lengthComputable) {
                var percentage = (evt.loaded * 100 / evt.total).toFixed();
                var percentstatus = (percentage + "%");
                window.updateProgress(percentstatus, lstate);
            } else {
                var units = " MB";
                var dlCount = evt.loaded / megabyte;
                var progress = Math.ceil(dlCount * 100.0) / 100.0;
                if (progress > 0) {
                    if (progress >= edownloaded) {
                        edownloaded = progress;
                    }
                    if (edownloaded > 0) {
                        if (edownloaded > kilobyte) {
                            units = " GB";
                            edownloaded = (edownloaded / kilobyte);
                        }
                        var tdownloaded = (downloaded + edownloaded);
                        var sizestatus = ("" + tdownloaded.toFixed()) + units;
                        window.updateProgress(sizestatus, lstate);
                    }
                }
            }
        }
    };
    if (TOOLKIT.SceneManager.OnAssetManagerProgress != null) {
        TOOLKIT.SceneManager.OnAssetManagerProgress = (evt) => {
            window.handleExtraProgress(evt);
        };
    }
    if (TOOLKIT.SceneManager.OnSceneRevealedObservable != null) {
        TOOLKIT.SceneManager.OnSceneRevealedObservable.add((scene) => {
            if (TOOLKIT.SceneManager.ShowFPS) {
                TOOLKIT.SceneManager.ShowFPS(true, cornerAnchor);
            } else {
                TOOLKIT.SceneManager.ShowFPS(false);
            }
        });        
    }        
    // ************************************************************************ //
    // SCENE LOADER - Execute Scene Loading With Progress Information           //
    // ************************************************************************ //
    window.executeSceneLoader = (root, name) => {
        window.updateStatus("PLEASE WAIT", "LOADING", 0);
        // The promise form reports every failure: a failed load disposes the scene it created, so the callback form has no
        // scene to pass to its onError callback once the previous scene is disposed (a missing file only logs an error)
        BABYLON.SceneLoader.LoadAsync(root, name, engine, (evt) => {
            window.handleLoadProgress(evt);
        }).then((newscene) => {
            window.scene = newscene;
            //window.scene.blockMaterialDirtyMechanism = true;
            window.scene.executeWhenReady(() => {
                loaded = true;
                if (window.scene.cameras == null || window.scene.cameras.length <= 0) {
                    window.dxcam = new BABYLON.FreeCamera("Default Camera", new BABYLON.Vector3(0, 5, -10), window.scene);
                    window.dxcam.setTarget(BABYLON.Vector3.Zero());
                }
                // DEPRECTAED
                //if (window.scene.cameras == null || window.scene.cameras.length <= 0) {
                //    var camera = new TOOLKIT.UniversalCamera("DefaultCamera", new BABYLON.Vector3(0, 5, -10), window.scene);
                //    camera.setTarget(BABYLON.Vector3.Zero());
                //    camera.attachControl(divcvs, true);
                //    window.scene.activeCamera = camera;
                //    console.warn("Warning: Attached engine page default camera");
                //    if (window.scene.lights == null || window.scene.lights.length <= 0) {
                //        var light = new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0, 1, 0), window.scene);
                //        light.intensity = 1.0;
                //        console.warn("Warning: Attached engine page default light");
                //    }
                //    window.setTimeout(()=>{ window.hideSceneLoader(); }, 3000);
                //}
                // One render loop at a time: a reload replaces the previous loop instead of stacking another one.
                if (window.sceneRenderLoop != null) engine.stopRenderLoop(window.sceneRenderLoop);
                window.sceneRenderLoop = () => { 
                    if (TOOLKIT.SceneManager.RenderLoopReady === true && TOOLKIT.SceneManager.PauseRenderLoop === false && TOOLKIT.SceneManager.LostRenderContext === false) {
                        if (window.METER) {
                            window.METER.tickStart();
                            if (TOOLKIT.SceneManager.OnPreRenderLoopObservable.hasObservers() === true) {
                                TOOLKIT.SceneManager.OnPreRenderLoopObservable.notifyObservers();
                            }
                            window.scene.render();
                            if (TOOLKIT.SceneManager.OnPostRenderLoopObservable.hasObservers() === true) {
                                TOOLKIT.SceneManager.OnPostRenderLoopObservable.notifyObservers();
                            }
                            window.METER.tick();
                        } else {
                            if (TOOLKIT.SceneManager.OnPreRenderLoopObservable.hasObservers() === true) {
                                TOOLKIT.SceneManager.OnPreRenderLoopObservable.notifyObservers();
                            }
                            window.scene.render();
                            if (TOOLKIT.SceneManager.OnPostRenderLoopObservable.hasObservers() === true) {
                                TOOLKIT.SceneManager.OnPostRenderLoopObservable.notifyObservers();
                            }
                        }
                    }
                };
                engine.runRenderLoop(window.sceneRenderLoop);
                window.resizeRenderingCanvas();
                // DEPRECIATED
                // if (autohide === true) {
                //    window.setTimeout(()=>{ // Note: Fallback Hide Scene Loader Handler
                //        var hideSceneLoaderHandled = (window.scene != null && window.scene.metadata != null && window.scene.metadata.toolkit != null && window.scene.metadata.toolkit.hideloader != null && window.scene.metadata.toolkit.hideloader === true);
                //        if (hideSceneLoaderHandled === false) {
                //            if (divcvs.style.opacity !== "1") {
                //                window.hideSceneLoader();
                //                console.warn("FALLBACK: Hide Scene Loader Timeout: 5000ms");
                //            }
                //        }
                //    }, 5000); 
                // }
            });
        }, (exception) => {
            var failureMessage = (exception && exception.message) || ("Unknown error loading scene: " + name);
            window.showErrorMessage(failureMessage);
        });
    };
    window.loadSceneFile = () => {
        loaded = false;
        // Unload the previous scene first so it can be garbage-collected (render loop, scene and default camera).
        if (window.sceneRenderLoop != null) { engine.stopRenderLoop(window.sceneRenderLoop); window.sceneRenderLoop = null; }
        if (window.dxcam != null) window.dxcam = null;
        if (window.scene != null && window.scene.isDisposed !== true) {
            try { TOOLKIT.SceneManager.DisposeScene(window.scene); } catch (e) { console.warn("Dispose previous scene failed: " + e); }
        }
        window.scene = null;
        window.showSceneLoader();
        window.executeSceneLoader(scenepath, scenename);
    };
    // ************************************************************************ //
    // SCENE CHANGE - Load A Requested Scene With The Normal Page Load          //
    // ************************************************************************ //
    // A SceneLoad message (TOOLKIT.SceneChange.RequestScene, or any same-origin page posting { scene: "file.gltf" })
    // reloads this frame on ?scene= so the destination loads like any scene, behind the normal splash screen. The
    // message's title and color are there for a custom splash; the destination reads its entry from TOOLKIT.SceneChange.
    window.sceneLoadInProgress = false;
    window.resolveSceneLoadRequest = (request) => {
        if (request == null) return null;
        if (typeof request.sceneFile === "string" && request.sceneFile !== "" && typeof request.rootUrl === "string" && request.rootUrl !== "") {
            return { sceneFile: request.sceneFile, rootUrl: request.rootUrl };
        }
        if (typeof request.scene !== "string" || request.scene === "") return null;
        var currentFolder = new URL(scenepath, window.location.href).href;
        var address = new URL(request.scene, currentFolder);
        var sceneFile = address.pathname.substring(address.pathname.lastIndexOf("/") + 1);
        var rootUrl = address.href.substring(0, address.href.length - address.search.length - address.hash.length - sceneFile.length);
        return { sceneFile: sceneFile, rootUrl: rootUrl };
    };
    window.applySceneToAddress = (pageUrl, destination) => {
        var address = new URL(pageUrl);
        address.searchParams.set("scene", destination.sceneFile);
        // The page's own scene folder needs no parameters; any other folder loads with root + path=./
        var defaultFolder = new URL(hosturl + folder, window.location.href).href;
        if (defaultFolder === destination.rootUrl) { address.searchParams.delete("root"); address.searchParams.delete("path"); }
        else { address.searchParams.set("root", destination.rootUrl); address.searchParams.set("path", "./"); }
        return address.href;
    };
    window.handleSceneLoadRequest = (request, event) => {
        if (event != null && event.origin !== window.location.origin) return;
        var destination = window.resolveSceneLoadRequest(request);
        if (destination == null || window.sceneLoadInProgress === true) return;
        window.sceneLoadInProgress = true;
        // Remembered per tab, so the requested scene wins over a baked default scene on the load below
        try { sessionStorage.setItem("__bt_engine_scene", destination.sceneFile); } catch (storageError) { }
        // Keep the top page address in step (index.html passes its query to this frame), so a full reload stays here
        try {
            if (window.top !== window && window.top.location.origin === window.location.origin) {
                window.top.history.replaceState(window.top.history.state, "", window.applySceneToAddress(window.top.location.href, destination));
            }
        } catch (topError) { }
        window.location.replace(window.applySceneToAddress(window.location.href, destination));
    };
    if (TOOLKIT.SceneChange) TOOLKIT.SceneChange.HostHandlesRequests = true;
    TOOLKIT.SceneManager.EventBus.OnMessage("SceneLoad", window.handleSceneLoadRequest);
    window.defaultSceneLoader = () => {
        try {
            window.loadSceneFile();
        } catch (ex2) {
            window.showErrorMessage(ex2.message || "Unknown Scene Exception");
        }
    };
    window.havokPhysicsLoader = () => {
        try {
            if (typeof HavokPhysics !== "undefined") {
                HavokPhysics().then((havok) => {
                    globalThis.HK = havok;
                    defaultSceneLoader();
                });
            } else {
                window.defaultSceneLoader();
            }
        } catch (ex4) {
            window.showErrorMessage(ex4.message || "Unknown Havok Exception");
        }
    };
    window.startSceneLoader = () => {
        // TODO: STANDALONE REQUIRED - Show the standalone warning cover as new splash screen with open anyways link that flips back to splash screen and starts the loader as normal by calling window.havokPhysicsLoader()
        // TODO: STANDALONE REQUIRED - var standalone_warning = document.getElementById("standalone-warning");
        // TODO: STANDALONE REQUIRED - if (standalone_warning != null) standalone_warning.style.display = "flex";
        // TODO: STANDALONE REQUIRED - if (splash != null) splash.className = "hidden";
        // ..
        // TODO: STANDALONE NOT REQUIRED - Load scene file as normal
        window.havokPhysicsLoader();
    };
    // ************************************************************************ //
    // RENDER CANVAS - Engine Reseize Observer Notification                     //
    // ************************************************************************ //
    window.checkOrientation = () => {
        // if (window.screen.orientation != null) {
        //     var orientation = window.screen.orientation.type;
        //     if (orientation === "landscape-primary" || orientation === "landscape-secondary") {
        //         document.getElementById("portrait-warning").style.display = "none";
        //         document.getElementById("landscape-warning").style.display = "none";
        //     } else {
        //         document.getElementById("portrait-warning").style.display = "block";
        //         document.getElementById("landscape-warning").style.display = "none";
        //     }
        // }
    };
    window.resizeRenderingCanvas = (forceSizing) => {
        if (engine != null) engine.resize(forceSizing);
        if (TOOLKIT.SceneManager.OnEngineResizeObservable.hasObservers() === true) {
            TOOLKIT.SceneManager.OnEngineResizeObservable.notifyObservers(engine);
        }
    };
    window.addEventListener("resize", () => { window.resizeRenderingCanvas(); });
    window.addEventListener("orientationchange", () => { window.checkOrientation(); });
    // ************************************************************************ //
    // BABYLON ENGINE - Create Engine And Load Project Scene Hiearchy           //
    // ************************************************************************ //
    // WebGPU only: load glslang/twgsl (the GLSL-to-WGSL converter every GLSL post-process needs) right after initAsync
    // instead of lazily seconds later, and say so once when it fails or stalls. Fire-and-forget: it never throws, never
    // rejects and never delays the scene load. Babylon caches that load and never rejects it, so a load still pending at
    // the timeout is dropped for the next caller, and TOOLKIT.PostProcessor's watchdog retries it.
    window.warmGlslangAndTint = (webgpu, timeoutMs) => {
        return new Promise((resolve) => {
            let warmDone = false;
            let warmTimer = null;
            const warmFinish = (loaded, message) => {
                if (warmDone) return;
                warmDone = true;
                if (warmTimer != null) clearTimeout(warmTimer);
                if (!loaded && message) console.error(message);
                resolve(loaded);
            };
            try {
                if (webgpu == null || webgpu.isDisposed || webgpu.isWebGPU !== true || typeof webgpu.prepareGlslangAndTintAsync !== "function") { warmFinish(false); return; }
                if (webgpu._glslangAndTintAreFullyLoaded === true) { warmFinish(true); return; }
                const waitMs = (timeoutMs > 0) ? timeoutMs : 15000;
                warmTimer = setTimeout(() => {
                    warmTimer = null;
                    if (webgpu.isDisposed || webgpu._glslangAndTintAreFullyLoaded === true) { warmFinish(webgpu._glslangAndTintAreFullyLoaded === true); return; }
                    webgpu._workingGlslangAndTintPromise = null;
                    warmFinish(false, "WebGPU glslang/twgsl (scripts/glslang.js, glslang.wasm, twgsl.js, twgsl.wasm) did not load within " + (waitMs / 1000) + " s: GLSL post-processes (colour grading, bloom, vignette, FXAA) cannot render until it does. The stalled load is dropped so the next caller (TOOLKIT.PostProcessor retries it) starts a fresh one.");
                }, waitMs);
                webgpu.prepareGlslangAndTintAsync().then(() => { warmFinish(true); }, (warmError) => { warmFinish(false, "WebGPU glslang/twgsl failed to load: " + ((warmError && warmError.message) || warmError)); });
            } catch (warmError) {
                warmFinish(false, "WebGPU glslang/twgsl warm-up failed: " + ((warmError && warmError.message) || warmError));
            }
        });
    };
    window.setupBabylonEngineHostPage = () => {
        try {
            var useStencilBuffer = stencil;
            var preserveDrawBuffer = (preserve > 0);
            var gpuPerformanceProfile = window.isMobileDevice() ? "low-power" : "high-performance";
            if (profile === 1) gpuPerformanceProfile = "low-power";
            else if (profile === 2) gpuPerformanceProfile = "high-performance";
            var cpuPerformanceProfile = "default";
            if (profile === 1) cpuPerformanceProfile = "low-power";
            else if (profile === 2) cpuPerformanceProfile = "high-performance";
            // Draco mesh decoder (KHR_draco_mesh_compression), self-hosted beside glslang/twgsl in the scripts folder.
            // Set before the engine branch so WebGL and WebGPU both use it, and before any scene loads.
            if (BABYLON.DracoDecoder != null) BABYLON.DracoDecoder.DefaultConfiguration = { wasmUrl: "###SCRIPT###/draco.js", wasmBinaryUrl: "###SCRIPT###/draco.wasm" };
            if (renderengine === 1) {
                if (navigator.gpu) {
                    engine = new BABYLON.WebGPUEngine(divcvs, { audioEngine: legacyAudio, antialias: antialias, powerPreference: gpuPerformanceProfile, stencil: useStencilBuffer, enableAllFeatures:true, useLargeWorldRendering: useLargeWorlds, setMaximumLimits: true, doNotHandleContextLost: true });
                    engine.initAsync({ jsPath: "###SCRIPT###/glslang.js", wasmPath: "###SCRIPT###/glslang.wasm" }, { jsPath: "###SCRIPT###/twgsl.js", wasmPath: "###SCRIPT###/twgsl.wasm" }).catch((ex) => { showErrorMessage(ex.message || "Unknown WebGPU Exception"); }).then(() => {
                        window.warmGlslangAndTint(engine);
                        window.prepareBabylonEngineProperties();
                        if (snapshot === 1) {
                            engine.snapshotRenderingMode = BABYLON.Constants.SNAPSHOTRENDERING_STANDARD;
                        } else if (snapshot === 2) {
                            engine.snapshotRenderingMode = BABYLON.Constants.SNAPSHOTRENDERING_FAST;
                        }
                    });
                } else {
                    // BABYLON.Tools.Warn("WebGPU is not supported on platform. Falling back to WebGL");
                    engine = new BABYLON.Engine(divcvs, antialias, { audioEngine: legacyAudio, powerPreference: cpuPerformanceProfile, preserveDrawingBuffer: preserveDrawBuffer, stencil: useStencilBuffer, useLargeWorldRendering: useLargeWorlds, premultipliedAlpha: false, doNotHandleContextLost: true }, false);
                    window.prepareBabylonEngineProperties();
                }
            } else {
                engine = new BABYLON.Engine(divcvs, antialias, { audioEngine: legacyAudio, powerPreference: cpuPerformanceProfile, preserveDrawingBuffer: preserveDrawBuffer, stencil: useStencilBuffer, useLargeWorldRendering: useLargeWorlds, premultipliedAlpha: false, doNotHandleContextLost: true }, false);
                window.prepareBabylonEngineProperties();
            }
        } catch (ex3) {
            window.showErrorMessage(ex3.message || "Unknown Engine Exception");
        }
    };
    window.prepareBabylonEngineProperties = async () => {
        // ************************************************************************ //
        window.audioEngineClicked = false;    
        window.doAudioEngineClick = async () => {
            if (window.audioEngineClicked === false) {
                window.audioEngineClicked = true;
                document.removeEventListener("click", window.doAudioEngineClick);
                if (legacyAudio === true) {
                    if (TOOLKIT.AudioSource.UnlockLegacyAudio) {
                        TOOLKIT.AudioSource.UnlockLegacyAudio();
                        // BABYLON.Tools.Warn("Unlocked legacy audio engine");
                    }
                } else {
                    if (TOOLKIT.AudioSource.UnlockAudioEngine) {
                        await TOOLKIT.AudioSource.UnlockAudioEngine();
                        // BABYLON.Tools.Warn("Unlocked audio engine context");
                    }
                }   
            }
        }
        document.addEventListener("click", window.doAudioEngineClick);
        // ************************************************************************ //
        engine.loadingScreen = new LoadingScreen();
        engine.enableOfflineSupport = offline;
        // DEPRECIATED: engine.renderEvenInBackground = renderinbackground;
        // DEPRECIATED: engine.clear(new BABYLON.Color3(0, 0, 0), true, true, true);
        engine.displayLoadingUI();
        // The toolkit's built-in loading screen takes over the splash cover here: every loading stage shows on it from now on
        await TOOLKIT.SceneManager.InitializeRuntime(engine, { showDefaultLoadingScreen: true, hideLoadingUIWithEngine: false, defaultLoadingUIMarginTop: "180px" });
        // ************************************************************************ //
        // if (handlecontext === true) {
        //     engine.onContextLostObservable.add(()=>{
        //         TOOLKIT.SceneManager.LostRenderContext = true;
        //         console.warn(">>> Render context lost. Pausing render loop.");
        //     });
        //     engine.onContextRestoredObservable.add(()=>{
        //         if (TOOLKIT.SceneManager.OnRebuildContextObservable.hasObservers() === true) {
        //             TOOLKIT.SceneManager.OnRebuildContextObservable.notifyObservers(engine);
        //         }
        //         TOOLKIT.SceneManager.LostRenderContext = false;
        //         console.warn(">>> Render context resored. Unpaused render loop.");
        //     });
        // }
        // ************************************************************************ //
        // Support Adaptive Device Ratios                                           //
        // ************************************************************************ //
        if (adaptive === 1 || (adaptive === 0 && window.isMobileDevice() === false))
        {
            var devicePixelRatio = window.devicePixelRatio || 1.0;
            var hardwareScaling = (1.0 / devicePixelRatio);
            engine.setHardwareScalingLevel(hardwareScaling);
            BABYLON.Tools.Log("Adaptive scaling enabled");
        }
        else
        {
            engine.setHardwareScalingLevel(1);
            BABYLON.Tools.Log("Adaptive scaling disabled");
        }
        // ************************************************************************ //
        // KTX2 DECODER - Initialize Default Loader Locations                       //
        // ************************************************************************ //
        if (BABYLON.KhronosTextureContainer2 && BABYLON.KhronosTextureContainer2.URLConfig) {
            var href = window.location.href;
            var path = href.substring(0, href.lastIndexOf('/')) + "/";
            BABYLON.KhronosTextureContainer2.URLConfig.jsDecoderModule = path + "###SCRIPT###/babylon.ktx2decoder.js";
            BABYLON.KhronosTextureContainer2.URLConfig.jsMSCTranscoder = path + "###SCRIPT###/msc_basis_transcoder.js";
            BABYLON.KhronosTextureContainer2.URLConfig.wasmMSCTranscoder = path + "###SCRIPT###/msc_basis_transcoder.wasm";
            BABYLON.KhronosTextureContainer2.URLConfig.wasmZSTDDecoder = path + "###SCRIPT###/zstddec.wasm";
            BABYLON.KhronosTextureContainer2.URLConfig.wasmUASTCToASTC = path + "###SCRIPT###/uastc_astc.wasm";
            BABYLON.KhronosTextureContainer2.URLConfig.wasmUASTCToBC7 = path + "###SCRIPT###/uastc_bc7.wasm";
            BABYLON.KhronosTextureContainer2.URLConfig.wasmUASTCToRGBA_UNORM = path + "###SCRIPT###/uastc_rgba8_unorm_v2.wasm";
            BABYLON.KhronosTextureContainer2.URLConfig.wasmUASTCToRGBA_SRGB = path + "###SCRIPT###/uastc_rgba8_srgb_v2.wasm";
            BABYLON.KhronosTextureContainer2.URLConfig.wasmUASTCToR8_UNORM = path + "###SCRIPT###/uastc_r8_unorm.wasm";
            BABYLON.KhronosTextureContainer2.URLConfig.wasmUASTCToRG8_UNORM = path + "###SCRIPT###/uastc_rg8_unorm.wasm";
        }
        if (window.useServiceWorker === true) {
            // The content installer starts first (it never throws), so installed scene files load from this device
            window.updateStatus("PLEASE WAIT", "STARTING CONTENT", 0);
            window.startContentInstaller(scenepath, scenename).then(() => { window.startSceneLoader(); });
        } else {
            window.startSceneLoader();
        }
    };
    // ************************************************************************ //
    // PAGE VISIBLE - Pause Render Loop When Not Visible                        //
    // ************************************************************************ //
    document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === 'visible') {
            //console.log(">>> PAGE IS VISIBLE: " + document.visibilityState);
        } else {
            //console.lowarng(">>> PAGE IS NOT VISIBLE: " + document.visibilityState);
        }
    });
    // ************************************************************************ //
    // DEFAULT LOADER - Initialize Default Scene Loading                        //
    // ************************************************************************ //
    window.onload = () => {
        window.checkOrientation();
        if (scenename != null && scenename !== "") {
            window.setupBabylonEngineHostPage();
        }
    };
    </script>
